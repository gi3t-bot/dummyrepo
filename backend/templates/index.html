{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeamTask - Login</title>
  <meta name="description" content="Sign in to TeamTask to manage your projects and tasks." />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <script>
    /* apply saved theme before page loads so no flicker */
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  </script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <h1>🗂️ TeamTask</h1>
      <p>Manage projects and tasks with your team</p>
    </div>

    <!-- tab switcher -->
    <div class="d-flex gap-1 mb-2" style="border-bottom: 1px solid #ccc; padding-bottom: 10px;">
      <button class="btn btn-primary" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="btn btn-outline" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" novalidate>
      <div id="login-error"></div>

      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" class="form-control" type="text" placeholder="your username" required />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" class="form-control" type="password" placeholder="your password" required />
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign In</button>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" style="display:none;" novalidate>
      <div id="signup-error"></div>

      <div class="form-row">
        <div class="form-group">
          <label for="signup-first">First Name</label>
          <input id="signup-first" class="form-control" type="text" placeholder="Jane" />
        </div>
        <div class="form-group">
          <label for="signup-last">Last Name</label>
          <input id="signup-last" class="form-control" type="text" placeholder="Doe" />
        </div>
      </div>

      <div class="form-group">
        <label for="signup-username">Username *</label>
        <input id="signup-username" class="form-control" type="text" placeholder="janedoe" required />
      </div>

      <div class="form-group">
        <label for="signup-email">Email *</label>
        <input id="signup-email" class="form-control" type="email" placeholder="jane@example.com" required />
      </div>

      <div class="form-group">
        <label for="signup-password">Password *</label>
        <input id="signup-password" class="form-control" type="password" placeholder="Min 8 characters" required />
      </div>

      <div class="form-group">
        <label for="signup-password2">Confirm Password *</label>
        <input id="signup-password2" class="form-control" type="password" placeholder="Repeat password" required />
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="signup-btn">Create Account</button>
    </form>

    <div style="margin-top: 14px; text-align: center;">
      <button class="theme-toggle" id="theme-btn" style="background:#eee; border:1px solid #aaa; color:#333; padding:4px 12px; font-size:12px; cursor:pointer;">🌙 Dark</button>
    </div>

  </div>

  <div id="toast"></div>
  <script type="module" src="{% static 'js/auth.js' %}"></script>

</body>
</html>
